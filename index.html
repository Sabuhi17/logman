<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LOGMAN – Səhiyyə platforması (Demo MVP)</title>
<meta name="theme-color" content="#0b4f4a">
<style>
:root{--p:#0b4f4a;--p2:#0e6b63;--t:#14b8a6;--bg:#f4f7f6;--c:#fff;--tx:#12201f;--mu:#5a6b69;--ln:#d9e3e1;--er:#b42318;--wa:#8a5a00;--wab:#fff4d6;--ok:#16794c}
*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:72px}
a{color:var(--p2)}h1,h2,h3{line-height:1.25;margin:.2em 0 .5em}h1{font-size:1.5rem}h2{font-size:1.2rem}h3{font-size:1.02rem}
header{background:var(--p);color:#fff;padding:12px 16px;display:flex;gap:12px;align-items:center;justify-content:space-between}
header b{font-size:1.3rem;letter-spacing:.04em}header a{color:#fff}
.demo{background:var(--wab);color:var(--wa);padding:6px 16px;font-size:.85rem;border-bottom:1px solid #ecd9a0}
main{max-width:960px;margin:0 auto;padding:16px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--c);border-top:1px solid var(--ln);display:flex;padding-bottom:env(safe-area-inset-bottom,0)}
nav a{flex:1;text-align:center;padding:10px 4px;font-size:.8rem;text-decoration:none;color:var(--mu)}nav a.on{color:var(--p);font-weight:700;box-shadow:inset 0 3px var(--t)}
@media(min-width:760px){body{padding:0}nav{position:static;border:0;background:var(--p2);justify-content:center}nav a{flex:0 0 auto;padding:10px 22px;color:#d6f2ee;font-size:.95rem}nav a.on{color:#fff;box-shadow:inset 0 -3px var(--t)}}
.card{background:var(--c);border:1px solid var(--ln);border-radius:10px;padding:14px;margin:0 0 12px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sp{justify-content:space-between}
input,select,textarea,button{font:inherit;padding:9px 10px;border:1px solid var(--ln);border-radius:8px;background:#fff;color:var(--tx);max-width:100%}
textarea{width:100%;min-height:80px}label{display:block;font-size:.88rem;color:var(--mu);margin:8px 0 2px}.f input,.f select,.f textarea{width:100%}
button,.btn{background:var(--p);color:#fff;border:0;cursor:pointer;text-decoration:none;display:inline-block;border-radius:8px;padding:9px 14px}
button.s{background:#e3efed;color:var(--p)}button.d{background:var(--er)}button.sm{padding:5px 10px;font-size:.85rem}
:focus-visible{outline:3px solid var(--t);outline-offset:2px}
.b{display:inline-block;font-size:.75rem;padding:2px 8px;border-radius:99px;background:#e3efed;color:var(--p)}.b.v{background:#d9f5e6;color:var(--ok)}.b.ad{background:var(--wab);color:var(--wa);font-weight:700}.b.dm{background:#eee;color:#555}.b.r{background:#fde4e1;color:var(--er)}
.mu{color:var(--mu);font-size:.88rem}.st{color:#b7791f;font-weight:700}.ads{border:2px dashed #e0c36a;background:#fffbea}
.msg{padding:10px;border-radius:8px;margin:8px 0}.msg.er{background:#fde4e1;color:var(--er)}.msg.ok{background:#d9f5e6;color:var(--ok)}
table{width:100%;border-collapse:collapse;font-size:.88rem}th,td{padding:6px;border-bottom:1px solid var(--ln);text-align:left;vertical-align:top}.ov{overflow-x:auto}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.empty{text-align:center;color:var(--mu);padding:28px}
.av{width:44px;height:44px;border-radius:50%;background:var(--t);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><b>LOGMAN</b><span id="who"></span></header>
<div class="demo">Demo rejimi: məlumatlar yalnız bu brauzerdə (localStorage) saxlanılır və cihazlar arasında sinxronlaşmır. Bütün həkim və klinikalar uydurmadır. Platforma diaqnoz qoymur, təcili yardımı əvəz etmir (103).</div>
<nav id="nav"></nav>
<main id="app"></main>
<script>
const K='logman_v1',$=s=>document.querySelector(s);
const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const id=()=>Math.random().toString(36).slice(2,10),today=()=>new Date().toISOString().slice(0,10);
const CITIES=['Bakı','Gəncə','Sumqayıt','Lənkəran','Şəki','Mingəçevir'];
const SPECS=['Kardioloq','Pediatr','Dermatoloq','Nevroloq','Stomatoloq','Oftalmoloq','Terapevt','Ginekoloq'];
const ROLES={citizen:'Vətəndaş',blogger:'Bloqer',doctor:'Həkim',clinic_manager:'Klinika meneceri',admin:'Administrator'};
const FLAGS=['müalicə edir','100% sağal','dərmansız sağal','mütləq için','diaqnoz qoyuram','zəmanət verirəm'];
const PLANS=[['Free','Pulsuz profil',0],['Professional','Həkim üçün əlavə imkanlar',20],['Clinic Business','Klinika üçün genişləndirilmiş profil',100],['Sponsored Content','Sponsorlu paylaşım (başlanğıc)',50]];
let db,S={},msg='';
async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function save(){try{localStorage.setItem(K,JSON.stringify(db))}catch(x){msg='err:Yaddaşa yazmaq mümkün olmadı.'}}
async function seed(){
 const A=await sha('Admin123');
 db={users:[{id:'u0',email:'admin@logman.demo',pw:A,name:'Administrator',role:'admin',bio:'',city:'Bakı',created:today(),follows:[]}],
 doctors:[],clinics:[],reviews:[],posts:[],comments:[],reports:[],notifs:[],verifs:[],ads:[],audit:[],session:null};
 CITIES.slice(0,4).forEach((c,i)=>db.clinics.push({id:'c'+i,name:'Demo Klinika '+(i+1),type:['Özəl klinika','Dövlət xəstəxanası','Diaqnostika mərkəzi','Poliklinika'][i],sector:i==1?'Dövlət':'Özəl',city:c,addr:'Demo ünvan '+(i+1),phone:'+994 00 000 00 0'+i,hours:'09:00–18:00',services:SPECS.slice(i,i+3),verified:i<2,demo:1,owner:null}));
 SPECS.forEach((s,i)=>db.doctors.push({id:'d'+i,name:'Demo Həkim '+(i+1),spec:s,sub:'',city:CITIES[i%4],clinic:'c'+(i%4),bio:'Demo profil. Real şəxs deyil.',verified:i%3!=2,demo:1,user:null,updated:today()}));
 const dm=(t,i)=>db.reviews.push({id:id(),type:t,tid:(t=='d'?'d':'c')+i,uid:'u0',author:'Demo istifadəçi',rating:[5,4,3][i%3],text:'Demo rəy mətni.',status:'published',resp:'',date:today(),flagged:0});
 dm('d',0);dm('d',1);dm('c',0);
 db.posts.push({id:id(),uid:'u0',author:'Administrator',role:'admin',type:'maarifləndirici məlumat',text:'Demo paylaşım: gündəlik su qəbulu və müntəzəm həkim müayinəsi barədə ümumi maarifləndirici qeyd. Fərdi tibbi məsləhət deyil.',date:today(),status:'published',likes:[],sponsored:0});
 db.ads.push({id:id(),owner:'c0',ownerName:'Demo Klinika 1',title:'Demo sponsorlu elan',text:'Bu, demo reklam nümunəsidir.',plan:'Sponsored Content',status:'active',paid:'simulyasiya'});
 save();
}
const me=()=>db.users.find(u=>u.id===db.session);
const log=(a)=>{db.audit.unshift({t:new Date().toLocaleString('az'),by:me()?.email,a})};
const notify=(uid,t)=>db.notifs.unshift({id:id(),uid,t,read:0,date:today()});
function rate(tid){const r=db.reviews.filter(x=>x.tid===tid&&x.status==='published');return{n:r.length,avg:r.length?r.reduce((a,x)=>a+x.rating,0)/r.length:0,r}}
const stars=tid=>{const r=rate(tid);return r.n?`<span class="st">★ ${r.avg.toFixed(1)}</span> <span class="mu">(${r.n} rəy)</span>`:'<span class="mu">Hələ qiymətləndirilməyib</span>'};
const demoB=o=>o.demo?'<span class="b dm">Demo məlumat</span>':'';
const verB=o=>o.verified?'<span class="b v">✔ Təsdiqlənmiş</span>':'';
const clinic=i=>db.clinics.find(c=>c.id===i);
const opts=(a,v)=>`<option value="">Hamısı</option>`+a.map(x=>`<option${x===v?' selected':''}>${e(x)}</option>`).join('');
function flash(){const m=msg;msg='';if(!m)return'';const [t,x]=m.split(':');return`<div class="msg ${t}" role="alert">${e(x)}</div>`}
function nav(){const u=me(),h=location.hash||'#/home';
 const L=[['home','Ana səhifə'],['doctors','Həkimlər'],['clinics','Klinikalar'],['feed','Paylaşımlar'],[u?'me':'login','Profil']];
 if(u?.role==='admin')L.push(['admin','Admin']);
 $('#nav').innerHTML=L.map(([k,t])=>`<a href="#/${k}" class="${h.startsWith('#/'+k)?'on':''}">${t}</a>`).join('');
 $('#who').innerHTML=u?`${e(u.name)} <small>(${ROLES[u.role]})</small> <a href="#" onclick="out();return false">Çıxış</a>`:'<a href="#/login">Giriş</a>'}
function out(){db.session=null;save();location.hash='#/home';route()}
/* ---------- views ---------- */
function adBlock(){const a=db.ads.filter(x=>x.status==='active');return a.length?`<div class="card ads"><span class="b ad">Sponsorlu</span> ${a.map(x=>`<h3>${e(x.title)}</h3><p>${e(x.text)}</p><span class="mu">Sponsor: ${e(x.ownerName)} · Reklam reytinqə təsir etmir</span>`).join('')}</div>`:''}
function docCard(d){const c=clinic(d.clinic);return`<div class="card"><div class="row"><div class="av">${e(d.name.split(' ').pop()[0])}</div><div><h3>${e(d.name)}</h3><div class="mu">${e(d.spec)} · ${e(c?.name||'İş yeri təsdiqlənməyib')}</div></div></div><div class="row" style="margin:8px 0">${verB(d)}${demoB(d)}<span class="mu">${e(d.city)}</span></div><div class="row sp">${stars(d.id)}<a class="btn sm" href="#/doctor/${d.id}">Profilə bax</a></div></div>`}
function clCard(c){return`<div class="card"><h3>${e(c.name)}</h3><div class="mu">${e(c.type)} · ${e(c.sector)} · ${e(c.city)}</div><div class="row" style="margin:8px 0">${verB(c)}${demoB(c)}</div><div class="row sp">${stars(c.id)}<a class="btn sm" href="#/clinic/${c.id}">Profilə bax</a></div></div>`}
function home(){const q=S.hq||'';return`<h1>Etibarlı həkim və klinika axtarışı</h1>
<div class="card row"><input id="hq" placeholder="Ad, ixtisas və ya klinika" value="${e(q)}" style="flex:1" aria-label="Axtarış"><a class="btn" href="#/doctors" onclick="S.d={q:$('#hq').value}">Həkim axtar</a><a class="btn s" style="background:#e3efed;color:var(--p)" href="#/clinics" onclick="S.c={q:$('#hq').value}">Klinika axtar</a></div>
<h2>Populyar ixtisaslar</h2><div class="row">${SPECS.map(s=>`<a class="b" href="#/doctors" onclick="S.d={spec:'${s}'}">${s}</a>`).join('')}</div>
<h2>Şəhər üzrə</h2><div class="row">${CITIES.map(s=>`<a class="b" href="#/doctors" onclick="S.d={city:'${s}'}">${s}</a>`).join('')}</div>
${adBlock()}<h2>Seçilmiş həkimlər</h2><div class="grid">${db.doctors.filter(d=>d.verified).slice(0,3).map(docCard).join('')}</div>
<h2>Seçilmiş klinikalar</h2><div class="grid">${db.clinics.slice(0,2).map(clCard).join('')}</div>
<h2>Son paylaşımlar</h2>${db.posts.filter(p=>p.status==='published').slice(0,2).map(postCard).join('')||'<div class="empty">Hələ paylaşım yoxdur.</div>'}`}
function doctors(){const f=S.d||{};const sort=f.sort||'rel';
 let l=db.doctors.filter(d=>(!f.q||(d.name+d.spec+(clinic(d.clinic)?.name||'')).toLowerCase().includes(f.q.toLowerCase()))&&(!f.spec||d.spec===f.spec)&&(!f.city||d.city===f.city)&&(!f.sector||clinic(d.clinic)?.sector===f.sector)&&(!f.ver||d.verified)&&(!f.min||(rate(d.id).n&&rate(d.id).avg>=+f.min)));
 const R=d=>rate(d.id);if(sort==='rate')l.sort((a,b)=>R(b).avg-R(a).avg);if(sort==='cnt')l.sort((a,b)=>R(b).n-R(a).n);if(sort==='name')l.sort((a,b)=>a.name.localeCompare(b.name,'az'));
 return`<h1>Həkimlər</h1><div class="card f"><div class="grid"><div><label>Ad / açar söz</label><input id="fq" value="${e(f.q||'')}"></div><div><label>İxtisas</label><select id="fs">${opts(SPECS,f.spec)}</select></div><div><label>Şəhər / rayon</label><select id="fc">${opts(CITIES,f.city)}</select></div><div><label>Sektor</label><select id="fe">${opts(['Dövlət','Özəl'],f.sector)}</select></div><div><label>Minimum reytinq</label><select id="fm"><option value="">Hamısı</option>${[3,4,4.5].map(x=>`<option${f.min==x?' selected':''}>${x}</option>`)}</select></div><div><label>Sıralama</label><select id="fo">${[['rel','Uyğunluğa görə'],['rate','Reytinqə görə'],['cnt','Rəy sayına görə'],['name','Ada görə']].map(([v,t])=>`<option value="${v}"${sort===v?' selected':''}>${t}</option>`)}</select></div></div>
<label><input type="checkbox" id="fv" ${f.ver?'checked':''} style="width:auto"> Yalnız təsdiqlənmiş</label><div class="row" style="margin-top:8px"><button onclick="S.d={q:$('#fq').value,spec:$('#fs').value,city:$('#fc').value,sector:$('#fe').value,min:$('#fm').value,sort:$('#fo').value,ver:$('#fv').checked};route()">Axtar</button><button class="s" onclick="S.d={};route()">Təmizlə</button></div></div>
<p class="mu">${l.length} nəticə (orqanik; reklam nəticələrə qarışdırılmır)</p><div class="grid">${l.map(docCard).join('')||'<div class="empty">Nəticə tapılmadı. Filtrləri dəyişin.</div>'}</div>`}
function clinics(){const f=S.c||{};const l=db.clinics.filter(c=>(!f.q||(c.name+c.services.join()).toLowerCase().includes(f.q.toLowerCase()))&&(!f.city||c.city===f.city)&&(!f.sector||c.sector===f.sector)&&(!f.ver||c.verified));
 return`<h1>Klinikalar</h1><div class="card f"><div class="grid"><div><label>Ad / xidmət</label><input id="fq" value="${e(f.q||'')}"></div><div><label>Şəhər / rayon</label><select id="fc">${opts(CITIES,f.city)}</select></div><div><label>Sektor</label><select id="fe">${opts(['Dövlət','Özəl'],f.sector)}</select></div></div><label><input type="checkbox" id="fv" ${f.ver?'checked':''} style="width:auto"> Yalnız təsdiqlənmiş</label><div class="row" style="margin-top:8px"><button onclick="S.c={q:$('#fq').value,city:$('#fc').value,sector:$('#fe').value,ver:$('#fv').checked};route()">Axtar</button><button class="s" onclick="S.c={};route()">Təmizlə</button></div></div><div class="grid">${l.map(clCard).join('')||'<div class="empty">Nəticə tapılmadı.</div>'}</div>`}
function reviewsHtml(type,tid,canRespond){const u=me(),r=rate(tid),all=db.reviews.filter(x=>x.tid===tid&&x.status==='published');
 const dist=[5,4,3,2,1].map(s=>`${s}★ ${all.filter(x=>x.rating===s).length}`).join(' · ');
 const mine=u&&db.reviews.find(x=>x.tid===tid&&x.uid===u.id&&x.status!=='hidden');
 return`<h2>Rəylər</h2><div class="card">${stars(tid)}<div class="mu">${r.n?dist:''}</div></div>
${all.map(x=>`<div class="card"><div class="row sp"><b>${e(x.author)}</b><span class="mu">${x.date}</span></div><span class="st">${'★'.repeat(x.rating)}</span> <span class="b dm">İstifadəçi rəyi</span><p>${e(x.text)}</p>${x.resp?`<div class="card" style="background:#f0f7f6"><b>Cavab:</b> ${e(x.resp)}</div>`:''}<div class="row">${u?`<button class="s sm" onclick="report('review','${x.id}')">Şikayət et</button>`:''}${canRespond&&!x.resp?`<button class="sm" onclick="respond('${x.id}')">İctimai cavab yaz</button>`:''}</div></div>`).join('')||'<div class="empty">Hələ rəy yoxdur.</div>'}
${!u?'<p><a href="#/login">Rəy yazmaq üçün daxil olun</a></p>':mine?'<p class="mu">Siz bu profil üçün artıq rəy yazmısınız (təkrar rəy qəbul edilmir).</p>':`<div class="card f"><h3>Rəy yaz</h3><label>Reytinq</label><select id="rr">${[5,4,3,2,1].map(n=>`<option value="${n}">${n} ulduz</option>`)}</select><label>Mətn (ən azı 10 simvol)</label><textarea id="rt"></textarea><p class="mu">Şəxsi və sağlamlıq məlumatlarınızı yazmayın.</p><button onclick="addReview('${type}','${tid}')">Rəyi göndər</button></div>`}`}
function doctor(i){const d=db.doctors.find(x=>x.id===i);if(!d)return nf();const c=clinic(d.clinic),u=me();
 return`<a href="#/doctors">← Həkimlər</a><div class="card"><h1>${e(d.name)}</h1><div class="row">${verB(d)}${demoB(d)}${!d.verified?'<span class="b">Təsdiqlənməyib</span>':''}</div><p><b>${e(d.spec)}</b>${d.sub?' · '+e(d.sub):''} · ${e(d.city)}</p><p>${e(d.bio)}</p><p>İş yeri: ${c?`<a href="#/clinic/${c.id}">${e(c.name)}</a>${c.verified?'':' <span class="mu">(təsdiqlənməyib)</span>'}`:'<span class="mu">Təsdiqlənməyib</span>'}</p><p class="mu">Son yenilənmə: ${d.updated}</p></div>${reviewsHtml('d',d.id,u&&(d.user===u.id||(c&&c.owner===u.id)))}
<h2>Maarifləndirici yazılar</h2>${db.posts.filter(p=>p.uid===d.user&&p.status==='published').map(postCard).join('')||'<div class="empty">Hələ yazı yoxdur.</div>'}`}
function clinicPage(i){const c=clinic(i);if(!c)return nf();const u=me();
 return`<a href="#/clinics">← Klinikalar</a><div class="card"><h1>${e(c.name)}</h1><div class="row">${verB(c)}${demoB(c)}</div><p>${e(c.type)} · ${e(c.sector)} · ${e(c.city)}</p><p>Ünvan: ${e(c.addr)}<br>Telefon: ${e(c.phone)}<br>İş saatları: ${e(c.hours)}</p><p>Xidmətlər: ${c.services.map(s=>`<span class="b">${e(s)}</span>`).join(' ')}</p></div>
<h2>Həkimlər</h2><div class="grid">${db.doctors.filter(d=>d.clinic===c.id).map(docCard).join('')||'<div class="empty">Əlaqəli həkim yoxdur.</div>'}</div>${reviewsHtml('c',c.id,u&&c.owner===u.id)}`}
const nf=()=>'<div class="empty">Səhifə tapılmadı.</div>';
function postCard(p){const u=me(),au=db.users.find(x=>x.id===p.uid),dr=db.doctors.find(d=>d.user===p.uid),cm=db.comments.filter(c=>c.pid===p.id);
 return`<div class="card"><div class="row sp"><div><b>${e(p.author)}</b> <span class="b">${ROLES[p.role]||p.role}</span> ${dr?.verified?'<span class="b v">✔ Təsdiqlənmiş həkim</span>':''}</div><span class="mu">${p.date}</span></div><span class="b dm">${e(p.type)}</span><p>${e(p.text)}</p><p class="mu">Paylaşım tibbi məsləhət deyil; həkimə müraciət edin.</p>
<div class="row"><button class="s sm" onclick="like('${p.id}')">♥ ${p.likes.length}</button>${u&&au&&u.id!==p.uid?`<button class="s sm" onclick="follow('${p.uid}')">${u.follows.includes(p.uid)?'İzlənilir':'İzlə'}</button>`:''}${u?`<button class="s sm" onclick="report('post','${p.id}')">Şikayət</button>`:''}${u&&u.id===p.uid?`<button class="d sm" onclick="delPost('${p.id}')">Sil</button>`:''}</div>
${cm.map(c=>`<div class="mu" style="margin-top:6px"><b>${e(c.author)}:</b> ${e(c.text)}</div>`).join('')}${u?`<div class="row" style="margin-top:8px"><input id="cm${p.id}" placeholder="Şərh yaz" style="flex:1"><button class="sm" onclick="comment('${p.id}')">Göndər</button></div>`:''}</div>`}
function feed(){const u=me();return`<h1>Paylaşımlar</h1>${u?`<div class="card f"><label>Növ</label><select id="pt">${['mətn','məqalə','maarifləndirici məlumat'].map(x=>`<option>${x}</option>`)}</select><label>Mətn</label><textarea id="px"></textarea><button onclick="addPost()">Paylaş</button></div>`:'<p><a href="#/login">Paylaşmaq üçün daxil olun</a></p>'}${adBlock()}<h2>Orqanik paylaşımlar</h2>${db.posts.filter(p=>p.status==='published').map(postCard).join('')||'<div class="empty">Hələ paylaşım yoxdur. İlk paylaşımı siz yaradın.</div>'}`}
function login(){return`<h1>Giriş və qeydiyyat</h1><div class="grid"><div class="card f"><h2>Daxil ol</h2><label>E-poçt</label><input id="le" type="email"><label>Şifrə</label><input id="lp" type="password"><br><br><button onclick="doLogin()">Daxil ol</button><p class="mu">Demo admin: admin@logman.demo / Admin123</p></div>
<div class="card f"><h2>Qeydiyyat</h2><label>Ad Soyad</label><input id="rn"><label>E-poçt</label><input id="re" type="email"><label>Şifrə (ən azı 8 simvol)</label><input id="rp" type="password"><label>Hesab növü</label><select id="rl"><option value="citizen">Vətəndaş</option><option value="blogger">Bloqer</option><option value="doctor">Həkim (təsdiq tələb olunur)</option><option value="clinic_manager">Klinika meneceri (təsdiq tələb olunur)</option></select><label>İxtisas (həkim) / müəssisə adı (klinika)</label><input id="rx" list="sl"><datalist id="sl">${SPECS.map(s=>`<option>${s}`).join('')}</datalist><br><br><button onclick="doReg()">Qeydiyyatdan keç</button></div></div>`}
function meView(){const u=me();if(!u)return login();const d=db.doctors.find(x=>x.user===u.id),c=db.clinics.find(x=>x.owner===u.id),my=db.notifs.filter(n=>n.uid===u.id),vs=db.verifs.filter(v=>v.uid===u.id),ads=db.ads.filter(a=>a.uid===u.id);
 return`<h1>${e(u.name)}</h1><div class="row"><span class="b">${ROLES[u.role]}</span>${d?`<span class="b ${d.verified?'v':''}">${d.verified?'✔ Təsdiqlənmiş həkim':'Təsdiq gözləyir'}</span>`:''}${c?`<span class="b ${c.verified?'v':''}">${c.verified?'✔ Təsdiqlənmiş klinika':'Təsdiq gözləyir'}</span>`:''}</div>
<div class="grid"><div class="card f"><h2>Profil</h2><label>Ad</label><input id="mn" value="${e(u.name)}"><label>Bio</label><textarea id="mb">${e(u.bio)}</textarea><label>Şəhər</label><select id="mc">${opts(CITIES,u.city)}</select><br><br><button onclick="saveMe()">Yadda saxla</button><p class="mu">Qeydiyyat: ${u.created}</p></div>
<div class="card"><h2>Bildirişlər (${my.filter(n=>!n.read).length} oxunmamış)</h2>${my.map(n=>`<div class="${n.read?'mu':''}">• ${e(n.t)} <small>${n.date}</small></div>`).join('')||'<div class="empty">Bildiriş yoxdur.</div>'}<button class="s sm" onclick="db.notifs.forEach(n=>n.uid==='${u.id}'&&(n.read=1));save();route()">Hamısını oxunmuş et</button></div></div>
${u.role==='doctor'||u.role==='clinic_manager'||u.role==='blogger'?`<div class="card f"><h2>Reklam sifarişi (simulyasiya)</h2><p class="mu">Qiymətlər demo fərziyyədir. Real ödəniş qəbul edilmir.</p><label>Başlıq</label><input id="ad1"><label>Mətn</label><textarea id="ad2"></textarea><label>Paket</label><select id="ad3">${PLANS.map(p=>`<option>${p[0]} — ${p[2]} AZN (demo)</option>`)}</select><br><br><button onclick="addAd()">Sifariş göndər</button>${ads.map(a=>`<div class="mu">• ${e(a.title)} — <b>${a.status}</b></div>`).join('')}</div>`:''}
${u.role==='blogger'||u.role==='citizen'?'<p class="mu">Həkim və ya klinika statusu üçün yeni hesab növü ilə qeydiyyat və admin təsdiqi tələb olunur.</p>':''}
${vs.length?`<div class="card"><h2>Təsdiq müraciətləri</h2>${vs.map(v=>`<div>• ${v.kind}: <b>${v.status}</b></div>`).join('')}</div>`:''}
<div class="card"><h2>Hesab</h2><button class="d" onclick="if(confirm('Hesab silinsin?')){delAcc()}">Hesabı sil / məlumat müraciəti</button> <p class="mu">Rəylər anonimləşdirilərək saxlanıla bilər (platforma etibarlılığı üçün).</p></div>`}
function admin(){const u=me();if(u?.role!=='admin')return'<div class="msg er">Bu səhifəyə giriş icazəniz yoxdur.</div>';const t=S.at||'dash';
 const T=[['dash','Panel'],['ver','Təsdiq'],['rep','Şikayətlər'],['rev','Rəylər'],['post','Paylaşımlar'],['ads','Reklamlar'],['usr','İstifadəçilər'],['aud','Audit'],['sys','Sistem']];
 const q=(S.aq||'').toLowerCase();let b='';
 if(t==='dash'){const st=[['İstifadəçi',db.users.length],['Həkim',db.doctors.length],['Təsdiqlənmiş həkim',db.doctors.filter(d=>d.verified).length],['Klinika',db.clinics.length],['Təsdiqlənmiş klinika',db.clinics.filter(c=>c.verified).length],['Paylaşım',db.posts.length],['Dərc olunmuş rəy',db.reviews.filter(r=>r.status==='published').length],['Moderasiya gözləyən rəy',db.reviews.filter(r=>r.status==='pending').length],['Açıq şikayət',db.reports.filter(r=>r.status==='open').length],['Sponsorlu elan',db.ads.filter(a=>a.status==='active').length]];b=`<div class="grid">${st.map(([k,v])=>`<div class="card"><div class="mu">${k}</div><h1>${v}</h1></div>`).join('')}</div>`}
 if(t==='ver')b=tbl(['Növ','Müraciətçi','Status',''],db.verifs.map(v=>[v.kind,v.name,v.status,v.status==='pending'?`<button class="sm" onclick="verify('${v.id}',1)">Təsdiqlə</button> <button class="d sm" onclick="verify('${v.id}',0)">Rədd et</button>`:'']));
 if(t==='rep')b=tbl(['Hədəf','Səbəb','Status',''],db.reports.map(r=>[r.kind+': '+e((r.kind==='review'?db.reviews.find(x=>x.id===r.tid)?.text:db.posts.find(x=>x.id===r.tid)?.text||'').slice(0,60)),r.reason,r.status,r.status==='open'?`<button class="sm" onclick="resolve('${r.id}',1)">Gizlət</button> <button class="s sm" onclick="resolve('${r.id}',0)">Saxla</button>`:'']));
 if(t==='rev')b=tbl(['Rəy','Reytinq','Status',''],db.reviews.filter(r=>!q||r.text.toLowerCase().includes(q)).map(r=>[e(r.text.slice(0,70)),r.rating,r.status+(r.flagged?' ⚑':''),`<button class="sm" onclick="setRev('${r.id}','published')">Dərc et</button> <button class="d sm" onclick="setRev('${r.id}','hidden')">Gizlət</button>`]));
 if(t==='post')b=tbl(['Paylaşım','Müəllif','Status',''],db.posts.map(p=>[e(p.text.slice(0,70)),e(p.author),p.status,`<button class="sm" onclick="setPost('${p.id}','published')">Dərc et</button> <button class="d sm" onclick="setPost('${p.id}','hidden')">Gizlət</button>`]));
 if(t==='ads')b=tbl(['Elan','Paket','Status',''],db.ads.map(a=>[e(a.title),a.plan,a.status+' (ödəniş: '+a.paid+')',`<button class="sm" onclick="setAd('${a.id}','active')">Aktiv et</button> <button class="d sm" onclick="setAd('${a.id}','rejected')">Rədd et</button>`]));
 if(t==='usr')b=tbl(['Ad','E-poçt','Rol'],db.users.map(x=>[e(x.name),e(x.email),`<select onchange="setRole('${x.id}',this.value)" ${x.id===u.id?'disabled':''}>${Object.entries(ROLES).map(([k,v])=>`<option value="${k}"${k===x.role?' selected':''}>${v}</option>`)}</select>`]));
 if(t==='aud')b=tbl(['Vaxt','Admin','Əməliyyat'],db.audit.map(a=>[a.t,e(a.by),e(a.a)]));
 if(t==='sys')b=`<div class="card"><p>Şəhərlər (demo): ${CITIES.join(', ')}. İxtisaslar: ${SPECS.join(', ')}.</p><p class="mu">Bu siyahılar rəsmi inzibati siyahı deyil. Real versiyada verilənlər bazasından idarə olunmalıdır.</p><button class="d" onclick="if(confirm('Bütün demo məlumatları sıfırlansın?')){localStorage.removeItem('${K}');location.reload()}">Demo məlumatları sıfırla</button></div>`;
 return`<h1>Admin paneli</h1><div class="tabs">${T.map(([k,v])=>`<button class="${t===k?'':'s'} sm" onclick="S.at='${k}';route()">${v}</button>`).join('')}</div><input placeholder="Axtar (rəylər)" value="${e(S.aq||'')}" onchange="S.aq=this.value;route()" aria-label="Axtarış"><br><br>${b}<p class="mu">Qeyd: demo rejimində icazə brauzerdə yoxlanılır. Real MVP-də yalnız server/RLS vasitəsilə yoxlanmalıdır.</p>`}
function tbl(h,rows){return rows.length?`<div class="ov"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${rows.slice(0,50).map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</table></div>`:'<div class="empty">Hələ məlumat yoxdur.</div>'}
/* ---------- actions ---------- */
const need=()=>{const u=me();if(!u){msg='er:Əvvəlcə daxil olun.';location.hash='#/login';route()}return u};
async function doLogin(){const em=$('#le').value.trim().toLowerCase(),h=await sha($('#lp').value),u=db.users.find(x=>x.email===em&&x.pw===h);if(!u){msg='er:E-poçt və ya şifrə yanlışdır.';return route()}db.session=u.id;save();location.hash='#/me'}
async function doReg(){const n=$('#rn').value.trim(),em=$('#re').value.trim().toLowerCase(),p=$('#rp').value,r=$('#rl').value,x=$('#rx').value.trim();
 if(n.length<2||!/^\S+@\S+\.\S+$/.test(em)||p.length<8){msg='er:Ad, düzgün e-poçt və ən azı 8 simvollu şifrə daxil edin.';return route()}
 if(db.users.some(u=>u.email===em)){msg='er:Bu e-poçt artıq qeydiyyatdadır.';return route()}
 if(r==='doctor'&&!SPECS.includes(x)){msg='er:Həkim üçün siyahıdan ixtisas seçin.';return route()}
 if(r==='clinic_manager'&&x.length<3){msg='er:Müəssisə adını yazın.';return route()}
 const u={id:id(),email:em,pw:await sha(p),name:n,role:r,bio:'',city:'',created:today(),follows:[]};db.users.push(u);
 if(r==='doctor'){db.doctors.push({id:id(),name:n,spec:x,sub:'',city:'Bakı',clinic:null,bio:'',verified:false,demo:0,user:u.id,updated:today()});db.verifs.push({id:id(),uid:u.id,name:n,kind:'həkim',status:'pending'})}
 if(r==='clinic_manager'){db.clinics.push({id:id(),name:x,type:'Klinika',sector:'Özəl',city:'Bakı',addr:'',phone:'',hours:'',services:[],verified:false,demo:0,owner:u.id});db.verifs.push({id:id(),uid:u.id,name:x,kind:'klinika',status:'pending'})}
 db.session=u.id;save();msg='ok:Qeydiyyat tamamlandı.'+(r==='doctor'||r==='clinic_manager'?' Təsdiq müraciətiniz admin yoxlamasına göndərildi.':'');location.hash='#/me'}
function saveMe(){const u=me(),n=$('#mn').value.trim();if(n.length<2){msg='er:Ad boş ola bilməz.';return route()}u.name=n;u.bio=$('#mb').value.slice(0,300);u.city=$('#mc').value;save();msg='ok:Profil yeniləndi.';route()}
function delAcc(){const u=me();db.users=db.users.filter(x=>x.id!==u.id);db.reviews.forEach(r=>{if(r.uid===u.id)r.author='Silinmiş istifadəçi'});db.session=null;save();location.hash='#/home';route()}
function addReview(type,tid){const u=need();if(!u)return;const t=$('#rt').value.trim(),n=+$('#rr').value;
 const d=db.doctors.find(x=>x.id===tid),c=clinic(tid);if((d&&d.user===u.id)||(c&&c.owner===u.id)){msg='er:Öz profilinizə rəy yaza bilməzsiniz.';return route()}
 if(t.length<10){msg='er:Rəy mətni ən azı 10 simvol olmalıdır.';return route()}
 if(db.reviews.some(r=>r.tid===tid&&r.uid===u.id)){msg='er:Təkrar rəy qəbul edilmir.';return route()}
 const bad=FLAGS.some(f=>t.toLowerCase().includes(f));db.reviews.push({id:id(),type,tid,uid:u.id,author:u.name.split(' ')[0]+'.',rating:n,text:t,status:bad?'pending':'published',resp:'',date:today(),flagged:bad?1:0});
 save();msg=bad?'ok:Rəy moderasiyaya göndərildi.':'ok:Rəy dərc edildi.';route()}
function respond(rid){const t=prompt('İctimai cavabınız:');if(!t||t.trim().length<3)return;const r=db.reviews.find(x=>x.id===rid);r.resp=t.trim();notify(r.uid,'Rəyinizə cavab verildi.');save();route()}
function report(kind,tid){const u=need();if(!u)return;const R=['təhqir','şəxsi məlumatların yayılması','saxta rəy şübhəsi','spam','sübutsuz ciddi ittiham','digər'];const r=prompt('Səbəb: '+R.join(', '),R[0]);if(!r)return;db.reports.push({id:id(),kind,tid,uid:u.id,reason:r.slice(0,80),status:'open'});save();msg='ok:Şikayət göndərildi.';route()}
function addPost(){const u=need();if(!u)return;const t=$('#px').value.trim();if(t.length<10){msg='er:Mətn ən azı 10 simvol olmalıdır.';return route()}
 const bad=FLAGS.some(f=>t.toLowerCase().includes(f));db.posts.unshift({id:id(),uid:u.id,author:u.name,role:u.role,type:$('#pt').value,text:t,date:today(),status:bad?'pending':'published',likes:[],sponsored:0});save();msg=bad?'ok:Paylaşım tibbi məzmun yoxlaması üçün moderasiyaya göndərildi.':'ok:Paylaşıldı.';route()}
function delPost(i){db.posts=db.posts.filter(p=>p.id!==i||p.uid!==db.session);save();route()}
function like(i){const u=need();if(!u)return;const p=db.posts.find(x=>x.id===i),k=p.likes.indexOf(u.id);k<0?(p.likes.push(u.id),p.uid!==u.id&&notify(p.uid,'Paylaşımınız bəyənildi.')):p.likes.splice(k,1);save();route()}
function comment(i){const u=need();if(!u)return;const t=$('#cm'+i).value.trim();if(!t)return;const p=db.posts.find(x=>x.id===i);db.comments.push({id:id(),pid:i,author:u.name,text:t});notify(p.uid,'Paylaşımınıza şərh yazıldı.');save();route()}
function follow(i){const u=need();if(!u)return;const k=u.follows.indexOf(i);k<0?u.follows.push(i):u.follows.splice(k,1);save();route()}
function addAd(){const u=need();if(!u)return;const t=$('#ad1').value.trim(),x=$('#ad2').value.trim();if(t.length<3||x.length<10){msg='er:Başlıq və mətn daxil edin.';return route()}
 db.ads.push({id:id(),uid:u.id,owner:u.id,ownerName:u.name,title:t,text:x,plan:$('#ad3').value.split(' — ')[0],status:'pending',paid:'simulyasiya'});save();msg='ok:Sifariş göndərildi (ödəniş simulyasiyadır).';route()}
const adm=()=>me()?.role==='admin';
function verify(i,ok){if(!adm())return;const v=db.verifs.find(x=>x.id===i);v.status=ok?'təsdiqləndi':'rədd edildi';const d=db.doctors.find(x=>x.user===v.uid),c=db.clinics.find(x=>x.owner===v.uid);if(v.kind==='həkim'&&d)d.verified=!!ok;if(v.kind==='klinika'&&c)c.verified=!!ok;notify(v.uid,'Təsdiq müraciətiniz: '+v.status);log('Təsdiq: '+v.name+' → '+v.status);save();route()}
function resolve(i,hide){if(!adm())return;const r=db.reports.find(x=>x.id===i);r.status=hide?'həll edildi':'rədd edildi';if(hide){const t=r.kind==='review'?db.reviews.find(x=>x.id===r.tid):db.posts.find(x=>x.id===r.tid);if(t)t.status='hidden'}log('Şikayət '+r.kind+' → '+r.status);save();route()}
function setRev(i,s){if(!adm())return;db.reviews.find(x=>x.id===i).status=s;log('Rəy '+s);save();route()}
function setPost(i,s){if(!adm())return;db.posts.find(x=>x.id===i).status=s;log('Paylaşım '+s);save();route()}
function setAd(i,s){if(!adm())return;const a=db.ads.find(x=>x.id===i);a.status=s;if(a.uid)notify(a.uid,'Reklam statusu: '+s);log('Reklam '+s);save();route()}
function setRole(i,r){if(!adm())return;db.users.find(x=>x.id===i).role=r;log('Rol dəyişdi → '+r);save();route()}
/* ---------- router ---------- */
function route(){if(!db)return;const [,p,a]=(location.hash||'#/home').split('/');let h;
 try{h=({home,doctors,clinics,feed,login,me:meView,admin,doctor:()=>doctor(a),clinic:()=>clinicPage(a)}[p]||home)()}catch(x){h='<div class="msg er">Xəta baş verdi. Səhifəni yeniləyin.</div>';console.error(x)}
 $('#app').innerHTML=flash()+h;nav();scrollTo(0,0)}
addEventListener('hashchange',()=>{route()});
(async()=>{try{db=JSON.parse(localStorage.getItem(K)||'null')}catch(x){db=null}if(!db)await seed();route()})();
</script>
</body>
</html>
